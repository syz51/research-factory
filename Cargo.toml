[package]
name = "research-factory"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "lab: quality gate, lessons ledger and retrospectives for agent-driven research projects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/syz51/research-factory"
readme = "README.md"
publish = false

[[bin]]
name = "lab"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
globset = { version = "0.4.21", default-features = false }
jiff = "0.2.39"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
toml = "0.9.8"
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3.27.0"
